<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>uPVC Billing Software SaaS</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold text-center text-slate-800 mb-6">uPVC Billing Login</h2>
    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700">Email Address</label>
        <input type="email" id="email" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700">Password</label>
        <input type="password" id="password" required class="w-full mt-1 p-2 border rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
      </div>
      <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition">Login to Dashboard</button>
    </form>
    <p id="msg" class="mt-4 text-center text-sm text-slate-600"></p>
  </div>

  <script>
    // আপলোড হওয়া আসল Render Backend URL
    const API_URL = 'https://upvc-backend-ivai.onrender.com';

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const msg = document.getElementById('msg');

      msg.innerText = "Connecting to cloud server...";

      try {
        const res = await fetch(`${API_URL}/api/auth/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        
        if (res.ok) {
          msg.className = "mt-4 text-center text-sm text-green-600 font-bold";
          msg.innerText = "Login Successful! Token: " + data.token.substring(0, 15) + "...";
        } else {
          msg.className = "mt-4 text-center text-sm text-red-600 font-bold";
          msg.innerText = data.message || "Login failed!";
        }
      } catch (err) {
        msg.className = "mt-4 text-center text-sm text-red-600 font-bold";
        msg.innerText = "Server connection error!";
      }
    });
  </script>
</body>
</html>
